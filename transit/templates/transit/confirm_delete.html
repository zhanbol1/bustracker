{% extends "transit/base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<h1>Delete "{{ obj }}"?</h1>
<p>This cannot be undone.</p>
<form method="post">{% csrf_token %}
  <button class="btn danger">Yes, delete</button>
  <a class="btn ghost" href="{{ cancel_url }}">Cancel</a>
</form>
{% endblock %}
